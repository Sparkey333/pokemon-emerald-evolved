<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Indigo Dexforge — Pokémon Evolved sheet forge</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#121a2e; --panel2:#0d1324; --line:#2a3858;
    --text:#e8edf8; --muted:#8b9bc0; --dim:#5c6b8a;
    --indigo:#6366f1; --gold:#fbbf24; --sapphire:#38bdf8; --amethyst:#a78bfa;
    --emerald:#34d399; --garnet:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(ellipse at top,#151d38 0%,var(--bg) 55%);color:var(--text);min-height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:1.3rem;letter-spacing:.03em}
  header h1 span{color:var(--indigo)}
  header p{color:var(--dim);font-size:.78rem;width:100%;max-width:none}
  .counts{margin-left:auto;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  nav{display:flex;gap:8px;padding:14px 26px;flex-wrap:wrap}
  nav button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:.85rem;font-weight:600}
  nav button.on{color:#0a0e1a}
  nav button[data-tab=kanto].on{background:var(--gold);border-color:var(--gold)}
  nav button[data-tab=evolved].on{background:var(--sapphire);border-color:var(--sapphire)}
  nav button[data-tab=diy].on{background:var(--amethyst);border-color:var(--amethyst)}
  nav button[data-tab=research].on{background:var(--emerald);border-color:var(--emerald)}
  nav button[data-tab=vault].on{background:var(--garnet);border-color:var(--garnet)}
  .search{margin-left:auto}
  .search input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;width:220px;font-size:.85rem}
  main{padding:10px 26px 60px;max-width:1400px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-3px)}
  .card img{width:96px;height:96px;image-rendering:pixelated}
  .card .ph{width:96px;height:96px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);font-size:2rem;border:1px dashed var(--line);border-radius:8px}
  .card .no{font-size:.68rem;color:var(--dim)}
  .card .nm{font-size:.82rem;font-weight:700}
  .card .ty{font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .kanto .card:hover{border-color:var(--gold)}
  .evolved .card:hover{border-color:var(--sapphire)}
  .diy .card:hover{border-color:var(--amethyst)}
  .modal{position:fixed;inset:0;background:rgba(4,6,14,.88);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px;z-index:50}
  .modal.on{display:flex}
  .modal-inner{max-width:820px;width:100%}
  .modal-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
  .modal-bar h2{font-size:1.1rem;margin-right:auto}
  .modal-bar button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.8rem}
  .modal-bar button.on{color:var(--text);border-color:var(--indigo);background:#1c2440}
  .modal img{width:100%;border-radius:12px;border:1px solid var(--line)}
  iframe{width:100%;height:1300px;border:1px solid var(--line);border-radius:12px;background:#0a0e1a;margin-bottom:24px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:.82rem;color:var(--muted);margin:6px 0 18px;line-height:1.6}
  .note b.g{color:var(--emerald)} .note b.r{color:var(--garnet)}
  table{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--panel);border-radius:12px;overflow:hidden}
  th,td{border:1px solid var(--line);padding:8px 12px;text-align:left}
  th{background:var(--panel2);color:var(--muted)}
  td code{color:var(--sapphire)}
</style>
</head>
<body>
<header>
  <h1>◆ <span>INDIGO</span> DEXFORGE</h1>
  <div class="counts" id="counts"></div>
  <p>Pokémon Evolved ROM-hack sheet forge — character full sheets + 3D sprite action sheets for the original 151, the hack's new species, and the DarkHearts DIY branch. Local &amp; offline.</p>
</header>
<nav id="nav">
  <button data-tab="kanto" class="on">Kanto 151</button>
  <button data-tab="evolved">Evolved (official hack)</button>
  <button data-tab="diy">DIY Originals</button>
  <button data-tab="research">Research</button>
  <button data-tab="vault">Vault &amp; Rules</button>
  <span class="search"><input id="q" placeholder="search name / type…" /></span>
</nav>
<main id="main"></main>

<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-bar">
      <h2 id="m-title"></h2>
      <button id="m-char" class="on">Character sheet</button>
      <button id="m-act">Action sheet</button>
      <button id="m-close">✕ close</button>
    </div>
    <img id="m-img" alt="sheet" />
  </div>
</div>

<script src="data/species.js"></script>
<script src="data/reveal-art.js"></script>
<script>
const $=s=>document.querySelector(s);
let tab='kanto', q='';
const dirOf=e=> e.dex ? `sheets/${e.section}/${String(e.dex).padStart(3,'0')}-${e.slug}` : `sheets/${e.section}/${e.slug}`;

function cards(list){
  return `<div class="grid ${tab}">`+list.map((e,i)=>{
    const img = e.sprites && e.sprites.front
      ? `<img loading="lazy" src="${e.sprites.front}" alt="${e.name}">`
      : `<div class="ph">?</div>`;
    return `<div class="card" data-i="${i}">${img}
      <div class="no">${e.dex?('#'+String(e.dex).padStart(3,'0')):(e.method||'')}</div>
      <div class="nm">${e.name}</div>
      <div class="ty">${(e.types||[]).join(' · ')}</div></div>`;
  }).join('')+`</div>`;
}
function filtered(){
  const list = DEX[tab]||[];
  if(!q) return list;
  const s=q.toLowerCase();
  return list.filter(e=>e.name.toLowerCase().includes(s)||(e.types||[]).some(t=>t.includes(s))||(e.line||'').toLowerCase().includes(s));
}
function research(){
  return `<div class="note">Combined research imports — these are the two claude.ai artifacts this project grew from, preserved verbatim. Left: the <b>official-vs-DIY</b> comparison (canonical for the DIY branch: stone-branch evolutions, Infernodrake naming). Right: the earlier starter showcase (alt naming fork: Inferdrake, straight level-ups).</div>
  <iframe src="research/pokemon-evolved-official-vs-diy.html"></iframe>
  <iframe src="research/pokemon-evolved-showcase.html"></iframe>`;
}
function vault(){
  const c=DEX.counts;
  return `<div class="note">
    <b class="r">Guardrails (standing, per clean-emulation doctrine):</b> everything under <code>vault/kanto-151</code> (Game Freak / Nintendo sprites via PokeAPI) and <code>vault/evolved</code> (Pokémon Evolved fan art — calicorn, katten, jordanos, xiapher &amp; team / AtSign8877) is a <b class="r">local personal reference vault only</b> — never bundle, re-host, sell, or ship any of it in a distributed build. No ROMs or patches are stored here; play the hack by patching <i>your own</i> LeafGreen dump.<br><br>
    <b class="g">Shippable:</b> only <code>vault/diy</code> + <code>sheets/diy</code> — DarkHearts original species (BYOK-generated, yours).</div>
  <table>
    <tr><th>Vault</th><th>Contents</th><th>Source</th><th>Status</th></tr>
    <tr><td><code>vault/kanto-151</code></td><td>${c.kanto} species × front/back/shiny/back-shiny (FRLG, 64px)</td><td>PokeAPI sprites repo</td><td>REFERENCE ONLY</td></tr>
    <tr><td><code>vault/evolved</code></td><td>${c.evolved} new species (of ~203 in hack)</td><td>github.com/AtSign8877/Pokemon-Evolved · pkmnevolved.com</td><td>REFERENCE ONLY</td></tr>
    <tr><td><code>vault/diy</code></td><td>${c.diy} DarkHearts originals</td><td>BYOK generation (~/GameAssets keys)</td><td>ORIGINAL — SHIPPABLE</td></tr>
  </table>`;
}
function render(){
  const c=DEX.counts;
  $('#counts').textContent=`${c.kanto} kanto · ${c.evolved} evolved · ${c.diy} diy`;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=$('#main');
  if(tab==='research'){m.innerHTML=research();return}
  if(tab==='vault'){m.innerHTML=vault();return}
  const list=filtered();
  let html='';
  if(tab==='evolved'){
    html+=`<div class="note">In-game 64px sprites for the 203 new species exist only inside the hack's <code>evolutions.ips</code> — extract them by patching <b>your own</b> LeafGreen dump (see README pipeline), drop PNGs into <code>vault/evolved/front/&lt;slug&gt;.png</code>, re-run the two tools, and every sheet below upgrades automatically. Until then: sheets carry data + placeholders, and the real <b>artist reveal art</b> is in the gallery at the bottom.</div>`;
  }
  html+=cards(list);
  if(tab==='evolved' && window.REVEAL_ART && REVEAL_ART.length){
    html+=`<h3 style="margin:26px 0 10px;color:var(--sapphire)">Artist reveal art — pulled from Bluesky &amp; Tumblr (${REVEAL_ART.length})</h3>
    <div class="note">PointCrow-commissioned hack; sprite art by calicorn (lead), kattenkg, jordanosart, xiapher &amp; team. Local reference only — never re-host or ship. Click any image for the original post.</div>
    <div class="grid">`+REVEAL_ART.map(r=>`<a class="card" href="${r.source}" target="_blank" title="${(r.text||'').replace(/"/g,'&quot;')}">
      <img loading="lazy" src="${r.file}" style="width:100%;height:120px;object-fit:contain;image-rendering:auto">
      <div class="no">${(r.date||'').slice(0,10)}</div><div class="nm">${r.artist}</div></a>`).join('')+`</div>`;
  }
  m.innerHTML=html;
  m.querySelectorAll('.card[data-i]').forEach(el=>el.onclick=()=>openModal(list[+el.dataset.i]));
}
let modalEntry=null, modalMode='character';
function openModal(e){
  modalEntry=e; modalMode='character';
  $('#m-title').textContent=(e.dex?('#'+String(e.dex).padStart(3,'0')+' '):'')+e.name;
  syncModal(); $('#modal').classList.add('on');
}
function syncModal(){
  $('#m-char').classList.toggle('on',modalMode==='character');
  $('#m-act').classList.toggle('on',modalMode==='action');
  $('#m-img').src=`${dirOf(modalEntry)}/${modalMode==='character'?'character':'action'}.png`;
}
$('#m-char').onclick=()=>{modalMode='character';syncModal()};
$('#m-act').onclick=()=>{modalMode='action';syncModal()};
$('#m-close').onclick=()=>$('#modal').classList.remove('on');
$('#modal').onclick=ev=>{if(ev.target.id==='modal')$('#modal').classList.remove('on')};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$('#q').oninput=ev=>{q=ev.target.value;render()};
render();
</script>
</body>
</html>
