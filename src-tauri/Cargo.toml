[package]
name = "app"
version = "0.1.0"
description = "Pokemon Emerald Evolved — Official vs DIY starter showcase"
authors = ["DarkHearts"]
license = ""
repository = "https://github.com/Sparkey333/pokemon-emerald-evolved"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9"
tauri-plugin-opener = "2.5.4"
