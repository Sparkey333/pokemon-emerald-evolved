[package]
name = "indigo-dexforge"
version = "0.2.0"
description = "Indigo Dexforge — sprite vault, character & action sheets, animations"
authors = ["Ansom / DarkHearts"]
edition = "2021"

[lib]
name = "indigo_dexforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
